<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>飞划APS管理系统 · 离线DEMO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
<style>
:root {
  --bg: #f4f6fa; --card: #fff; --line: #e4e8f0;
  --pri: #2456e0; --pri-d: #1c46b8; --ok: #18a058; --warn: #d98b00; --err: #d03050;
  --txt: #1f2733; --sub: #7a8699; --side: #101b30;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif; background: var(--bg); color: var(--txt); }
#app { display: flex; min-height: 100vh; }
#sidebar { width: 210px; background: var(--side); color: #cdd6e6; display: flex; flex-direction: column; position: fixed; top:0; bottom:0; left:0; z-index: 10;}
.brand { font-size: 19px; font-weight: 700; color: #fff; padding: 18px 20px 2px; }
.brand-sub { font-size: 11px; color: #7d8db0; padding: 0 20px 14px; border-bottom: 1px solid #1e2c48; }
#nav { flex: 1; padding: 10px 0; overflow-y: auto; }
#nav a { display: block; padding: 10px 20px; color: #cdd6e6; text-decoration: none; font-size: 13.5px; border-left: 3px solid transparent; }
#nav a:hover { background: #182644; color: #fff; }
#nav a.on { background: #182644; color: #fff; border-left-color: var(--pri); }
.side-foot { padding: 14px 20px; font-size: 12px; color: #7d8db0; border-top: 1px solid #1e2c48; display:flex; justify-content: space-between; align-items:center;}
#main { flex: 1; margin-left: 210px; padding: 20px 24px; }
h2.page { font-size: 18px; margin-bottom: 14px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
.card h3 { font-size: 14px; margin-bottom: 10px; color: var(--sub); font-weight: 600;}
table { width: 100%; border-collapse: collapse; background: #fff; }
.table-wrap { width: 100%; overflow-x: auto; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; white-space: nowrap;}
th { color: var(--sub); font-weight: 600; background: #f8fafd; }
tr:hover td { background: #f6f9ff; }
.btn { display:inline-block; background: var(--pri); color:#fff; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
.btn:hover { background: var(--pri-d); }
.btn.ghost { background:#fff; color:var(--txt); border:1px solid var(--line); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn.danger { background: var(--err); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
input, select, textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; outline: none; background:#fff;}
input:focus, select:focus { border-color: var(--pri); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
.kpi .v { font-size: 22px; font-weight: 700; }
.kpi .t { font-size: 12px; color: var(--sub); }
.tag { display:inline-block; padding:1px 8px; border-radius: 10px; font-size: 12px; }
.tag.ok { background:#e8f7ef; color: var(--ok); }
.tag.warn { background:#fdf3e0; color: var(--warn); }
.tag.err { background:#fdebee; color: var(--err); }
.tag.info { background:#e8effd; color: var(--pri); }
.bar { height: 10px; background:#eef1f7; border-radius: 5px; overflow:hidden; min-width: 100px;}
.bar > i { display:block; height:100%; background: var(--pri); }
.bar > i.over { background: var(--err); }
.bar > i.warn { background: var(--warn); }
.hidden { display: none !important; }
.modal-mask { position: fixed; inset: 0; background: rgba(10,18,35,.45); z-index: 50; display:flex; align-items:center; justify-content:center;}
.modal { background:#fff; border-radius: 10px; padding: 20px; width: min(680px, 92vw); max-height: 86vh; overflow:auto; }
.modal h3 { margin-bottom: 12px; }
.modal .frow { display:flex; gap:10px; margin-bottom:10px; }
.modal .frow label { width: 96px; text-align:right; color:var(--sub); padding-top:7px; font-size:13px; flex-shrink:0;}
.modal .frow input, .modal .frow select { flex:1; }
.toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background:#1f2733; color:#fff; padding: 9px 20px; border-radius: 8px; z-index: 99; font-size: 13px;}
.empty { color: var(--sub); text-align:center; padding: 60px 0; }
/* gantt */
.gantt { overflow-x: auto; }
.g-row { display:flex; align-items:center; height: 30px; margin-bottom:2px; }
.g-label { width: 130px; flex-shrink:0; font-size:12px; color:var(--sub); }
.g-track { position:relative; flex:1; height: 24px; background: repeating-linear-gradient(90deg, #f0f3f9 0 1px, transparent 1px calc(100%/90)); background-color:#fafbfe; border-radius:4px; }
.g-bar { position:absolute; top:3px; height:18px; border-radius:4px; background: var(--pri); color:#fff; font-size:11px; line-height:18px; padding:0 6px; overflow:hidden; white-space:nowrap; cursor:default;}
.g-bar.late { background: var(--err); }
.g-bar.ok2 { background: var(--ok); }
/* login */
.login-body { display:flex; align-items:center; justify-content:center; min-height:100vh; background: linear-gradient(135deg,#101b30 0%, #1d3a6e 100%); }
.login-card { background:#fff; border-radius: 12px; padding: 36px 40px; width: 360px; text-align:center; }
.login-logo { font-size: 40px; }
.login-card h1 { font-size: 20px; margin: 6px 0 2px; }
.login-sub { color: var(--sub); font-size: 12px; margin-bottom: 22px; }
.login-card input { width: 100%; margin-bottom: 12px; padding: 10px 12px; }
.login-card button { width: 100%; padding: 10px; font-size: 15px; }
.login-err { color: var(--err); font-size: 12px; min-height: 18px; margin-top: 6px;}
.login-tip { color: var(--sub); font-size: 12px; margin-top: 8px; }
@media (max-width: 760px) {
  html, body { overflow-x: hidden; }
  #main { overflow-x: auto; }
  #sidebar { width: 56px; }
  .brand, .brand-sub { display: none; }
  #nav a { padding: 12px 0; text-align: center; font-size: 11px; }
  #main { margin-left: 56px; padding: 12px; }
  .side-foot { flex-direction: column; gap: 6px; }
}

.demo-tip { position:fixed; right:18px; bottom:18px; z-index:99; background:#1f2733; color:#fff;

  /* DEMO：不发请求，直接读内置数据 */

  var _d = DEMO.get(path);

function _apiReal(method, path, body, raw) {
  return fetch(path, {
    method: method,
    headers: Object.assign({'Content-Type': 'application/json'},
      TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {}),
    body: method === 'POST' ? JSON.stringify(body || {}) : undefined
  }).then(function (r) {
    if (r.status === 401) { localStorage.clear(); location.href = 'login.html'; throw new Error('unauth'); }
    if (r.status >= 400) {
      return r.text().then(function (t) {
        var msg = 'HTTP ' + r.status;
        try { msg = (JSON.parse(t) || {}).error || msg; } catch (e) { /* 非 JSON 响应 */ }
        throw new Error(msg);
      });
    }
    return raw ? r.text() : r.json();
  });
}
function GET(p) { return api('GET', p); }
function POST(p, b) {
  if (p.indexOf('/save') > 0 || p.indexOf('/delete') > 0 || p.indexOf('/adjust') > 0) {

function esc(s) {

  });

    }).join('');
    nav.onclick = function (e) {
      var a = e.target.closest('a'); if (!a) return;
      e.preventDefault();

    go(NAV.some(function (n) { return n[0] === key; }) ? key : 'dash');

var CUR = null;
function go(key) {

  document.querySelectorAll('#nav a').forEach(function (a) {

  var main = document.getElementById('main');

  var task;
  try {
    task = PAGES[key](main);
  } catch (e) {
    task = Promise.reject(e);
  }
  Promise.resolve(task).catch(function (e) {
    if (e && e.message === 'unauth') return;

      });
      gt.innerHTML = html || '<div class="empty">无排程明细</div>';
      var res = [];
      Object.keys(g).forEach(function (wc) {
        g[wc].forEach(function (o) {
          if (!res.find(function (x) { return x.wo === o.wo; })) res.push({wo: o.wo});
        });
      });
    });
    /* 工单结果表 */
    var r0 = latest.ops.length ? latest.ops[0] : null;
    /* 从 latest.run 的 detail 中提取结果不现实，直接聚合 ops */
    var byWo = groupBy(latest.ops, 'wo');

      ['工单', '工序数', '首工序开始', '末工序结束', '状态'],
      Object.keys(byWo), function (wo) {

          '</td></tr>';
      });
  }
  function groupBy(arr, k) {
    var m = {};
    arr.forEach(function (x) { (m[x[k]] = m[x[k]] || []).push(x); });
    return m;
  }
  function pushInModal() {

      rb.querySelectorAll('input[data-k]').forEach(function (i) { obj[i.getAttribute('data-k')] = i.value; });
      POST('/api/rules/save', {rules: obj}).then(function () { toast('规则已保存，下次排程生效'); })
        .catch(function (e) { toast(e.message || '失败', true); });
    };
    var ak = document.getElementById('ak-go');
    if (ak) ak.onclick = function () {
      POST('/api/api-keys/create', {name: document.getElementById('ak-name').value,
        role: document.getElementById('ak-role').value}).then(function (j) {
        document.getElementById('ak-out').innerHTML = '<div class="tag warn">仅显示一次</div> <code>' +
          esc(j.data.key) + '</code>';
      }).catch(function (e) { toast(e.message || '失败', true); });
    };
  });
};

</script>
<script>boot();</script>
</body>
</html>
